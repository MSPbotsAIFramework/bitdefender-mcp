# Local debugging only -- not used in deployment. Provide your own tenant's
# GravityZone API key as a header on each request, not as an env var here.
services:
  bitdefender-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "8080"
